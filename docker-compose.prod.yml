# Déploiement production : application seule.
# Le port est publié sur 127.0.0.1 uniquement : c'est TON reverse proxy
# (déjà en place sur le VPS) qui expose l'app au public en HTTPS.
#
# Usage :  docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    environment:
      PORT: 3000
      DB_PATH: /data/data.sqlite
    volumes:
      - habits-data:/data
    # Accessible seulement en local sur le VPS -> le reverse proxy s'y connecte.
    # Si ton reverse proxy tourne dans Docker, vois la note du README (réseau partagé).
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  habits-data:
