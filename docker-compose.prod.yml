# Déploiement production derrière Traefik.
#
# L'app ne publie AUCUN port : Traefik la joint via le réseau Docker partagé
# et applique le TLS (HTTPS) selon ta config Traefik existante.
#
# >>> 3 valeurs à adapter à TON installation Traefik (cherchées avec "ADAPTER") :
#   1. le nom du réseau Docker de Traefik   (ex: traefik, proxy, web...)
#   2. le nom de l'entrypoint HTTPS          (ex: websecure)
#   3. le nom du certresolver                (ex: letsencrypt, myresolver)
# Et bien sûr ton domaine dans la règle Host(...).
#
# Usage :  docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build: .
    environment:
      PORT: 3000
      DB_PATH: /data/data.sqlite
      # Console d'administration (/admin.html). Décommente et définis un mot de
      # passe pour l'activer. Évite de committer le secret : utilise un fichier
      # .env (docker compose le lit) ou l'environnement de l'hôte.
      # ADMIN_EMAIL: admin@famillemathieu.org
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - habits-data:/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # ADAPTER : ton domaine
      - "traefik.http.routers.habits.rule=Host(`habits.famillemathieu.org`)"
      # ADAPTER : entrypoint HTTPS de ta config Traefik
      - "traefik.http.routers.habits.entrypoints=websecure"
      - "traefik.http.routers.habits.tls=true"
      # ADAPTER : nom de ton certresolver
      - "traefik.http.routers.habits.tls.certresolver=letsencrypt"
      # Port interne du conteneur (ne pas changer)
      - "traefik.http.services.habits.loadbalancer.server.port=3000"

volumes:
  habits-data:
